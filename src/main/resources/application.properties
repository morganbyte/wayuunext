spring.application.name=wayuunext-app
# configuración de la base de datos (valores en .env, ver .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wayuu_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# mínimo 32 caracteres, generar con: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
